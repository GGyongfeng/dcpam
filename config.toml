# 设备坐标系下的取景框算法几何。
[device.geometry.view_frame]
# 取景框透光矩形宽度，单位为毫米。
width_mm = 22.0
# 取景框透光矩形高度，单位为毫米。
height_mm = 17.0

# 前取景框在设备坐标系下的算法几何定义。
[device.geometry.front_frame]
# 前设备实像面（毛玻璃后面、取景框前面、Z=0 面）上的中心点，单位为毫米。
point = [0.0, 0.0, 0.0]
# 前设备实像面法向量，无单位；平面方程由 point + normal 推导。
normal = [0.0, 0.0, 1.0]
# 透光圆角矩形转为直角矩形后的四个端点，单位为毫米。
rect_corners = [
    [-11.0, -8.5, 0.0],
    [11.0, -8.5, 0.0],
    [11.0, 8.5, 0.0],
    [-11.0, 8.5, 0.0],
]

# 后取景框在设备坐标系下的算法几何定义。
[device.geometry.rear_frame]
# 后设备实像面（毛玻璃后面、取景框前面、Z=0 面）上的中心点，单位为毫米。
point = [80.0, 0.0, 0.0]
# 后设备实像面法向量，无单位；平面方程由 point + normal 推导。
normal = [0.0, 0.0, 1.0]
# 透光圆角矩形转为直角矩形后的四个端点，单位为毫米。
rect_corners = [
    [69.0, -8.5, 0.0],
    [91.0, -8.5, 0.0],
    [91.0, 8.5, 0.0],
    [69.0, 8.5, 0.0],
]

# 前反射镜/分光片前表面在设备坐标系下的算法几何定义。
[device.geometry.front_reflection]
# 反射镜前表面上的一点，单位为毫米。
point = [0.0, 0.0, 23.0]
# 反射镜前表面法向量，无单位；平面方程由 point + normal 推导。
normal = [0.7071067811865475, 0.0, 0.7071067811865475]

# 后反射镜/分光片前表面在设备坐标系下的算法几何定义。
[device.geometry.rear_reflection]
# 反射镜前表面上的一点，单位为毫米。
point = [80.0, 0.0, 23.0]
# 反射镜前表面法向量，无单位；平面方程由 point + normal 推导。
normal = [0.7071067811865475, 0.0, 0.7071067811865475]

# 探测杆在设备坐标系下的算法几何。
[device.geometry.probe_rod]
root = [41.0, 37.0, -132.0]
length_mm = 109.0
