# PnP 标定阶段的设备端约定：每个成像面上 5 个圆点在其局部坐标系下的坐标。
#
# 用途：scripts/pnp/pnp_定位.py 用这里的 points 作为 object points 做 PnP，
# 解出「相机→成像面局部系」写入 config.toml.calibration.{front,rear}_camera_to_frame。
# 只在标定时被消费；pipeline 运行时不读本文件。
#
# points 由 scripts/pnp/pnp_影像仪转换.py 从 dataset/pnp/20260702.xlsx 生成，
# 并导出到 dataset/pnp/imaging_plane_points_device.csv；此处为其副本。
# 每次影像仪重新测量后需同步更新 points。圆点顺序：左上, 右上, 中, 左下, 右下。
# 坐标已在成像面局部系下（原点=框中心，自带朝向），故无需再给框的 point/normal/x_axis。

# 前成像面（2 号镜）：5 圆点局部坐标(mm)。
[front_frame]
points = [
    [-9.1487, -3.7806, 0.0002],
    [8.4573, -7.28, 0.0002],
    [1.572, -0.2435, 0.0],
    [-8.7201, 6.7484, -0.0002],
    [8.1005, 5.5575, -0.0003],
]

# 后成像面（1 号镜）：5 圆点局部坐标(mm)。
# 后框相对前框的 80mm 装配变换已解耦到 config.toml 的 geometry.rear_to_front。
[rear_frame]
points = [
    [-8.6113, -5.9634, -0.0002],
    [6.4568, -6.1447, -0.0],
    [-0.294, -1.4842, -0.0],
    [-10.1967, 6.3335, -0.0],
    [2.8415, 5.5828, 0.0001],
]
