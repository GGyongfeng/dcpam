[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# 两个源码包：核心 dcpam（仓库根）+ 应用层 dcpam_app（含 server/web/desktop）
packages = ["dcpam", "dcpam_app"]

[project]
name = "dcpam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.20.0,<2",
    "matplotlib>=3.3.0",
    "scipy>=1.6.0",
    "rich>=13.0.0",
    "opencv-python>=4.10.0.84,<4.11",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "starlette>=0.46.0,<1.0",
    "uvicorn[standard]>=0.30.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
camera = ["PyGObject>=3.50.0"]

[project.scripts]
dcpam = "dcpam_app.server.cli:main"
